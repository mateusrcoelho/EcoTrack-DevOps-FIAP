name: FIAP BDD API - validação
on:
  push:
    branches: [testes-automatizados-fiap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bdd-api:
    name: Testar EcoTrack com Oracle e Cucumber
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORACLE_PASSWORD: ciOraclePassword123
      DB_USER: ECOTRACK
      DB_PASSWORD: ciEcotrackPassword123
      JWT_SECRET: ci_jwt_secret_for_tests_only_0123456789_ABCDEFGHIJKLMNOPQRSTUVWXYZ
      JWT_EXPIRATION_MS: 86400000
      APP_ADMIN_ENABLED: "false"
      APP_ADMIN_PASSWORD: ciAdminPassword123
      SPRING_PROFILES_ACTIVE: local
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar JDK 21 e cache Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar e executar testes unitarios
        run: mvn -B -ntp clean verify

      - name: Inicializar banco Oracle e API
        run: docker compose up -d --build

      - name: Esperar API ficar saudavel
        shell: bash
        run: |
          mkdir -p target/ci-evidencias
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/actuator/health > target/ci-evidencias/health.json; then
              cat target/ci-evidencias/health.json
              docker compose ps | tee target/ci-evidencias/containers.txt
              exit 0
            fi
            sleep 10
          done
          echo 'API nao ficou saudavel antes do prazo' >&2
          docker compose ps
          exit 1

      - name: Executar 20 cenarios BDD e validar JSON Schema
        run: mvn -B -ntp verify -Pbdd-api -Decotrack.baseUrl=http://localhost:8080

      - name: Capturar logs e status da infraestrutura
        if: always()
        shell: bash
        run: |
          mkdir -p target/ci-evidencias
          docker compose ps > target/ci-evidencias/containers-final.txt 2>&1 || true
          docker compose logs --no-color --tail=300 > target/ci-evidencias/containers-logs.txt 2>&1 || true

      - name: Disponibilizar evidencias e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fiap-bdd-relatorios
          path: |
            target/bdd-report.html
            target/bdd-report.json
            target/bdd-report.xml
            target/failsafe-reports/
            target/surefire-reports/
            target/ci-evidencias/
          if-no-files-found: warn
          retention-days: 14

      - name: Encerrar containers e remover volume de teste
        if: always()
        run: docker compose down -v --remove-orphans || true
