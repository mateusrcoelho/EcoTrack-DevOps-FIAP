spring:
  application:
    name: ecotrack-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.OracleDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin:
    enabled: ${APP_ADMIN_ENABLED:false}
    name: ${APP_ADMIN_NAME:Administrador}
    email: ${APP_ADMIN_EMAIL:admin@ecotrack.com}
    password: ${APP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true

info:
  app:
    name: EcoTrack API
    version: 1.0.0
    description: API ESG para gestão de resíduos, coletas e indicadores ambientais
